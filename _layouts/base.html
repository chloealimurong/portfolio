<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/rain.css' | relative_url }}">
  </head>
  <body>
    <canvas id="rain-canvas" aria-hidden="true"></canvas>

    <header class="site-header">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav>
        <a href="{{ '/maps/' | relative_url }}">Maps</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </header>

    {{ content }}

    <footer class="site-footer">
      &copy; {{ 'now' | date: '%Y' }} {{ site.title }}. Rain background adapted from
      <a href="https://openprocessing.org/@u161812/2939960">a sketch by u161812</a>.
    </footer>

    <script src="{{ '/assets/js/rain.js' | relative_url }}"></script>
  </body>
</html>
